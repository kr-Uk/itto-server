# 프로젝트 이름 명시 — 디렉토리명/심볼릭 링크에 따라 자동 추론되는 걸 막아서
# 수동(SSH) 배포와 자동(GitHub Actions) 배포가 같은 컨테이너/네트워크/볼륨을 쓰도록 강제.
name: itto-server

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: itto-nginx
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  app:
    image: ghcr.io/kr-uk/itto-backend:latest
    container_name: itto-app
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FIREBASE_SERVICE_ACCOUNT: file:/app/config/firebase-service-account.json
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      # 객체 스토리지 — AWS S3 (변수명만 MINIO_* 그대로 유지)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-https://s3.ap-northeast-2.amazonaws.com}
      MINIO_REGION: ${MINIO_REGION:-ap-northeast-2}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-itto-photos}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://itto-photos.s3.ap-northeast-2.amazonaws.com}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SKIP_RECEIPT_VALIDATION: "false"
    volumes:
      - ./secrets/firebase-service-account.json:/app/config/firebase-service-account.json:ro
    depends_on:
      - postgres
      - redis
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: itto-postgres
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: itto-redis
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

networks:
  itto_net:

volumes:
  postgres_data:
  redis_data:
