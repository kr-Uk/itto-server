x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: itto-nginx
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
      - grafana
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: itto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: itto-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  app:
    image: ghcr.io/kr-uk/itto-backend:latest
    container_name: itto-app
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FIREBASE_SERVICE_ACCOUNT: file:/app/config/firebase-service-account.json
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-itto}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://api.hguitto.site/storage}
    volumes:
      - ./secrets/firebase-service-account.json:/app/config/firebase-service-account.json:ro
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: itto-postgres
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: itto-redis
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: itto-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: itto-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    container_name: itto-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.0
    container_name: itto-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - itto_net
    logging: *default-logging
    restart: unless-stopped

networks:
  itto_net:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
