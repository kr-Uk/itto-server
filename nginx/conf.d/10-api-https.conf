# Use real client IP from Cloudflare
map $http_cf_connecting_ip $rate_limit_key {
  default       $http_cf_connecting_ip;
  ''            $binary_remote_addr;
}

# Rate limit zones (use real client IP)
limit_req_zone $rate_limit_key zone=auth_limit:10m rate=5r/m;
limit_req_zone $rate_limit_key zone=token_limit:10m rate=10r/m;
limit_req_zone $rate_limit_key zone=api_limit:10m rate=30r/s;

server {
  listen 443 ssl;
  http2 on;
  server_name api.hguitto.site;

  ssl_certificate /etc/letsencrypt/live/api.hguitto.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.hguitto.site/privkey.pem;
  include /etc/nginx/snippets/ssl-params.conf;
  add_header X-Frame-Options DENY always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Block common vulnerability scan paths
  location ~* \.(php|asp|aspx|jsp|cgi)$ {
    return 444;
  }

  location ~* ^/(\.env|\.git|wp-admin|wp-login|wp-content|phpmyadmin|server-status|server-info) {
    return 444;
  }

  resolver 127.0.0.11 valid=10s;
  set $upstream_app app;
  set $upstream_minio minio;

  location /storage/ {
    proxy_pass http://$upstream_minio:9000/itto/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Block Swagger UI in production
  location ~* ^/(swagger-ui|v3/api-docs) {
    return 444;
  }

  # Block actuator endpoints from external access
  location ~* ^/actuator {
    return 444;
  }

  # Auth endpoints - strict rate limit (5r/m per IP)
  location /api/v1/auth/login {
    limit_req zone=auth_limit burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://$upstream_app:80;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 1m;
    proxy_read_timeout 30s;
  }

  location /api/v1/auth/signup {
    limit_req zone=auth_limit burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://$upstream_app:80;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 30m;
    proxy_read_timeout 60s;
  }

  # Token refresh - moderate rate limit (10r/m per IP)
  location /api/v1/auth/refresh {
    limit_req zone=token_limit burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://$upstream_app:80;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 1m;
    proxy_read_timeout 30s;
  }

  # Default - standard rate limit (30r/s per IP)
  location / {
    limit_req zone=api_limit burst=60 nodelay;
    limit_req_status 429;

    proxy_pass http://$upstream_app:80;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 30m;
    proxy_read_timeout 60s;
  }
}
