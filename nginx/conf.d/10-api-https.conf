server {
  listen 443 ssl;
  http2 on;
  server_name api.hguitto.site;

  ssl_certificate /etc/letsencrypt/live/api.hguitto.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.hguitto.site/privkey.pem;
  include /etc/nginx/snippets/ssl-params.conf;
  add_header X-Frame-Options DENY always;

  # Block common vulnerability scan paths
  location ~* \.(php|asp|aspx|jsp|cgi)$ {
    return 444;
  }

  location ~* ^/(\.env|\.git|wp-admin|wp-login|wp-content|phpmyadmin|server-status|server-info) {
    return 444;
  }

  location / {
    proxy_pass http://app:80;  # ✅ 임시 whoami
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 30m;
    proxy_read_timeout 60s;
  }
}
