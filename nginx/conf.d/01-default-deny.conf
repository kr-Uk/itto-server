# Default server block: reject requests with unknown Host header
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate /etc/nginx/certs/hguitto.site.pem;
  ssl_certificate_key /etc/nginx/certs/hguitto.site.key;

  return 444;
}
